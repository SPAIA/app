<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#3CF4A2" />

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
			rel="stylesheet"
		/>

		<meta property="og:site_name" content="SPAIA" />
		<meta property="og:type" content="website" />

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<!-- First-visit splash: shown once per device (localStorage flag), held 2s, then faded out. -->
		<div
			id="splash"
			style="position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center; background: #3cf4a2; transition: opacity 0.6s ease;"
		>
			<img
				src="%sveltekit.assets%/SPAIA%20logo%20blue%202023%20transparent-06.svg"
				alt="SPAIA"
				style="width: 100vw; height: 100dvh; object-fit: contain;"
			/>
		</div>
		<script>
			(function () {
				var splash = document.getElementById('splash');
				var seen = false;
				try {
					seen = localStorage.getItem('spaia_splash_seen') === '1';
					if (!seen) localStorage.setItem('spaia_splash_seen', '1');
				} catch (e) {}
				if (seen) {
					splash.remove();
					return;
				}
				setTimeout(function () {
					splash.style.opacity = '0';
					splash.addEventListener('transitionend', function () {
						splash.remove();
					});
				}, 2000);
			})();
		</script>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
